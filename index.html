<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Sky Runner 3D - بازی سه‌بعدی</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            background: #0a0e27;
            touch-action: none;
        }

        #gameContainer {
            width: 100%;
            height: 100%;
            position: relative;
            background: linear-gradient(180deg, #1a1f4b 0%, #0a0e27 100%);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            width: 100%;
            padding: max(12px, env(safe-area-inset-top)) 16px 0;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
        }

        .hud-item {
            background: rgba(26, 31, 75, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            border-radius: 14px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            color: #fff;
            font-weight: bold;
            text-align: center;
        }

        .hud-label {
            font-size: 11px;
            color: #7dd3fc;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .hud-value {
            font-size: 24px;
            color: #fff;
        }

        #startScreen, #gameOverScreen {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            background: rgba(10, 14, 39, 0.92);
            backdrop-filter: blur(8px);
        }

        #startScreen.hidden, #gameOverScreen.hidden {
            display: none;
        }

        .screen-content {
            text-align: center;
            color: #fff;
            max-width: 90%;
        }

        .screen-content h1 {
            font-size: 48px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #7dd3fc, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .screen-content p {
            font-size: 16px;
            color: #b0c4de;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .screen-content button {
            background: linear-gradient(135deg, #8b5cf6, #7dd3fc);
            border: none;
            color: white;
            padding: 16px 48px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 10px 30px rgba(139, 92, 246, 0.4);
            transition: all 0.3s;
            margin-top: 16px;
        }

        .screen-content button:active {
            transform: scale(0.95);
        }

        #controlButtons {
            position: absolute;
            bottom: max(12px, env(safe-area-inset-bottom));
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 150;
            pointer-events: auto;
        }

        .control-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            background: rgba(139, 92, 246, 0.8);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(139, 92, 246, 0.4);
            transition: all 0.1s;
            border: 2px solid rgba(125, 211, 252, 0.3);
        }

        .control-btn:active {
            background: rgba(139, 92, 246, 1);
            transform: scale(0.9);
            box-shadow: 0 4px 10px rgba(139, 92, 246, 0.6);
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="hud">
            <div class="hud-item">
                <div class="hud-label">⭐ امتیاز</div>
                <div class="hud-value" id="score">0</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">🏆 رکورد</div>
                <div class="hud-value" id="bestScore">0</div>
            </div>
        </div>

        <div id="startScreen">
            <div class="screen-content">
                <h1>🚀 Sky Runner 3D</h1>
                <p>هواپیما‌ی خود را هدایت کن، موانع را دور بزن و به رکورد جدید برسی!</p>
                <button onclick="startGame()">شروع بازی</button>
            </div>
        </div>

        <div id="gameOverScreen" class="hidden">
            <div class="screen-content">
                <h1>🎮 بازی تمام شد!</h1>
                <p id="finalScore" style="font-size: 32px; color: #7dd3fc; margin: 20px 0;">امتیاز: 0</p>
                <p id="recordMessage" style="color: #4ade80;"></p>
                <button onclick="startGame()">دوباره بازی کن</button>
            </div>
        </div>

        <div id="controlButtons">
            <button class="control-btn" onmousedown="moveLeft(true)" onmouseup="moveLeft(false)" ontouchstart="moveLeft(true)" ontouchend="moveLeft(false)">⬅️</button>
            <button class="control-btn" onmousedown="moveRight(true)" onmouseup="moveRight(false)" ontouchstart="moveRight(true)" ontouchend="moveRight(false)">➡️</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@r128/build/three.min.js"></script>
    <script>
        // Game Variables
        let scene, camera, renderer;
        let gameRunning = false;
        let score = 0;
        let bestScore = localStorage.getItem('skyrunner-best') || 0;
        let player = null;
        let obstacles = [];
        let coins = [];
        let gameTime = 0;
        let playerSpeed = { x: 0, z: 15 };
        let playerPos = { x: 0, y: 2, z: 30 };

        // Initialize Three.js
        function initThreeJS() {
            const container = document.getElementById('gameContainer');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1f4b);
            scene.fog = new THREE.Fog(0x1a1f4b, 150, 300);

            camera = new THREE.PerspectiveCamera(
                75,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            camera.position.set(0, 15, 50);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.HemisphereLight(0x87ceeb, 0x000000, 1.5);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
            directionalLight.position.set(100, 100, 100);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.far = 500;
            scene.add(directionalLight);

            createPlayer();
            createInitialRoad();
            updateBestScore();
            animate();
            window.addEventListener('resize', onWindowResize);
        }

        function createPlayer() {
            const geometry = new THREE.BoxGeometry(1.5, 2, 1.5);
            const material = new THREE.MeshStandardMaterial({
                color: 0x7dd3fc,
                metalness: 0.6,
                roughness: 0.3,
                emissive: 0x4a9eff
            });
            player = new THREE.Mesh(geometry, material);
            player.position.set(playerPos.x, playerPos.y, playerPos.z);
            player.castShadow = true;
            player.receiveShadow = true;
            scene.add(player);
        }

        function createInitialRoad() {
            for (let i = 0; i < 50; i++) {
                createRoadSegment(i * -40);
            }
        }

        function createRoadSegment(zPos) {
            const roadGeo = new THREE.PlaneGeometry(20, 40);
            const roadMat = new THREE.MeshStandardMaterial({
                color: 0x1e40af,
                metalness: 0.3,
                roughness: 0.7,
                emissive: 0x0f2555
            });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.rotation.x = -Math.PI / 2;
            road.position.set(0, -0.1, zPos);
            road.receiveShadow = true;
            scene.add(road);
        }

        function createObstacle(zPos) {
            const positions = [-6, 0, 6];
            const pos = positions[Math.floor(Math.random() * positions.length)];

            const geometry = new THREE.BoxGeometry(2, 2.5, 2);
            const material = new THREE.MeshStandardMaterial({
                color: 0xff6b6b,
                metalness: 0.5,
                roughness: 0.4,
                emissive: 0x8b0000
            });
            const obstacle = new THREE.Mesh(geometry, material);
            obstacle.position.set(pos, 1.25, zPos);
            obstacle.castShadow = true;
            obstacle.receiveShadow = true;
            obstacle.userData = { type: 'obstacle', collected: false };
            scene.add(obstacle);
            obstacles.push(obstacle);
        }

        function createCoin(zPos) {
            const positions = [-6, 0, 6];
            const pos = positions[Math.floor(Math.random() * positions.length)];

            const geometry = new THREE.CylinderGeometry(0.8, 0.8, 0.2, 32);
            const material = new THREE.MeshStandardMaterial({
                color: 0xffd700,
                metalness: 0.8,
                roughness: 0.2,
                emissive: 0xffaa00
            });
            const coin = new THREE.Mesh(geometry, material);
            coin.position.set(pos, 2, zPos);
            coin.rotation.x = Math.PI / 2;
            coin.castShadow = true;
            coin.receiveShadow = true;
            coin.userData = { type: 'coin', collected: false };
            scene.add(coin);
            coins.push(coin);
        }

        function moveLeft(press) {
            if (gameRunning && press) playerSpeed.x = -12;
            else if (!press && playerSpeed.x < 0) playerSpeed.x = 0;
        }

        function moveRight(press) {
            if (gameRunning && press) playerSpeed.x = 12;
            else if (!press && playerSpeed.x > 0) playerSpeed.x = 0;
        }

        function startGame() {
            gameRunning = true;
            gameTime = 0;
            score = 0;
            playerPos = { x: 0, y: 2, z: 30 };
            playerSpeed = { x: 0, z: 15 };
            obstacles = [];
            coins = [];
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameOverScreen').classList.add('hidden');
            document.getElementById('score').textContent = '0';

            // Clear scene
            scene.children = scene.children.filter(child => {
                if (child.userData && (child.userData.type === 'obstacle' || child.userData.type === 'coin')) {
                    scene.remove(child);
                    return false;
                }
                return true;
            });
        }

        function endGame() {
            gameRunning = false;
            if (score > bestScore) {
                bestScore = score;
                localStorage.setItem('skyrunner-best', bestScore);
                document.getElementById('recordMessage').textContent = '🎉 رکورد جدید!';
            } else {
                document.getElementById('recordMessage').textContent = '';
            }
            document.getElementById('finalScore').textContent = `امتیاز: ${score}`;
            document.getElementById('gameOverScreen').classList.remove('hidden');
        }

        function updateBestScore() {
            document.getElementById('bestScore').textContent = bestScore;
        }

        function animate() {
            requestAnimationFrame(animate);

            if (gameRunning) {
                gameTime += 0.016;
                score = Math.floor(gameTime * 10);
                document.getElementById('score').textContent = score;

                // Move player
                playerPos.x += playerSpeed.x * 0.016;
                playerPos.x = Math.max(-8, Math.min(8, playerPos.x));
                playerPos.z += playerSpeed.z * 0.016;

                player.position.set(playerPos.x, playerPos.y, playerPos.z);
                player.rotation.z = (playerSpeed.x / 20) * 0.5;

                // Camera follow
                camera.position.x += (playerPos.x - camera.position.x) * 0.1;
                camera.position.z = playerPos.z + 50;
                camera.lookAt(playerPos.x, playerPos.y, playerPos.z - 20);

                // Spawn obstacles and coins
                if (gameTime % 1 < 0.016) createObstacle(playerPos.z - 100);
                if (gameTime % 1.5 < 0.016) createCoin(playerPos.z - 120);

                // Check collisions
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    const obs = obstacles[i];
                    const dist = playerPos.x - obs.position.x;
                    const zDist = playerPos.z - obs.position.z;
                    if (Math.abs(dist) < 1.5 && Math.abs(zDist) < 2) {
                        endGame();
                        return;
                    }
                    if (obs.position.z > playerPos.z + 20) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Collect coins
                for (let i = coins.length - 1; i >= 0; i--) {
                    const coin = coins[i];
                    const dist = playerPos.x - coin.position.x;
                    const zDist = playerPos.z - coin.position.z;
                    if (Math.abs(dist) < 2 && Math.abs(zDist) < 2) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                        score += 50;
                    } else if (coin.position.z > playerPos.z + 20) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                    } else {
                        coin.rotation.y += 0.05;
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // Start
        window.addEventListener('load', initThreeJS);
    </script>
</body>
</html>
